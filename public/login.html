<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/login.css" />
</head>
<body>

  <!-- Fondo decorativo -->
  <div class="bg-noise" aria-hidden="true"></div>
  <div class="bg-glow" aria-hidden="true"></div>
  <div class="bg-lines" aria-hidden="true"></div>

  <main class="container">

    <div class="card">

      <!-- Marca -->
      <div class="brand">
        <div class="brand-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2.2"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2L2 7l10 5 10-5-10-5z"/>
            <path d="M2 17l10 5 10-5"/>
            <path d="M2 12l10 5 10-5"/>
          </svg>
        </div>
        <span class="brand-name">En3Partes</span>
        <span class="brand-by">powered by Woritco</span>
      </div>

      <h1 class="title">Bienvenido de nuevo</h1>
      <p class="subtitle">Ingresá tus datos para continuar</p>

      <!-- Alerta de error (oculta por defecto) -->
      <div class="alert" id="alert" role="alert" aria-live="polite">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <span id="alert-text"></span>
      </div>

      <!-- Formulario -->
      <form id="login-form" novalidate>

        <div class="field">
          <label for="email" class="label">Correo electrónico</label>
          <div class="input-wrap">
            <span class="input-icon">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="1.8"
                   stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="4" width="20" height="16" rx="2"/>
                <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
              </svg>
            </span>
            <input
              type="email"
              id="email"
              name="email"
              autocomplete="email"
              placeholder="tu@email.com"
              required
            />
          </div>
        </div>

        <div class="field">
          <div class="label-row">
            <label for="password" class="label">Contraseña</label>
            <a href="#" class="link-small">¿Olvidaste tu contraseña?</a>
          </div>
          <div class="input-wrap">
            <span class="input-icon">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="1.8"
                   stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </span>
            <input
              type="password"
              id="password"
              name="password"
              autocomplete="current-password"
              placeholder="••••••••"
              required
            />
            <button type="button" class="eye-btn" id="toggle-pw" aria-label="Mostrar contraseña">
              <svg id="eye-icon" width="15" height="15" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="1.8"
                   stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="btn" id="submit-btn">
          <span class="btn-text">Iniciar sesión</span>
          <span class="btn-spinner" id="spinner" aria-hidden="true"></span>
          <svg class="btn-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2.2"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14M12 5l7 7-7 7"/>
          </svg>
        </button>

      </form>

      <p class="register">
        ¿No tenés cuenta? <a href="/register.html" class="link">Registrate</a>
      </p>

    </div>

    <!-- Texto lateral decorativo -->
    <p class="side-text" aria-hidden="true">SISTEMA · ACCESO · SEGURO</p>

  </main>

  <script src="/js/login.js"></script>
</body>
</html>
